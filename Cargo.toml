[package]
name = "surl"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] } 
url = "2.5"
serde_json = "1"
anyhow = "1"
syntect = "5.3"
colored = "3.1"
