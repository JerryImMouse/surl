name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=surl
          mkdir dist
          cp target/${{ matrix.target }}/release/$name${{ matrix.ext }} dist/
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a ../$name-${{ matrix.target }}.zip .
          else
            tar czf ../$name-${{ matrix.target }}.tar.gz .
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            surl-*.zip
            surl-*.tar.gz
